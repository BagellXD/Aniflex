[package]
name = "orion-player"
version = "1.1.0"
description = "A local anime library and player"
authors = ["you"]
edition = "2021"
default-run = "orion-player"

[lib]
name = "orion_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
ctrlc = "3.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10.1"
tiny_http = "0.12"

[[bin]]
name = "prediction-test"
path = "src/prediction.rs"


[[bin]]
name = "media_server"
path = "src/bin/media_server.rs"