services:
  orion:
    build:
      context: .
    ports:
      - "${ORION_BIND_ADDRESS:-127.0.0.1}:1420:1420"
    environment:
      ANI_CLI_PLAYER: ffmpeg
      CARGO_BUILD_JOBS: ${ORION_CARGO_BUILD_JOBS:-2}
      TERM: xterm-256color
    volumes:
      - .:/app
      - orion_node_modules:/app/node_modules
      - orion_cargo_target:/app/src-tauri/target
    init: true

volumes:
  orion_node_modules:
  orion_cargo_target: